name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: gradle build --no-daemon
      - name: Pick jar
        run: |
          mkdir -p dist
          cp build/libs/warden-hit-1.0.0.jar dist/warden-hit.jar
      - uses: actions/upload-artifact@v4
        with:
          name: warden-hit
          path: dist/warden-hit.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build${{ github.run_number }}
          name: Warden Hit 1.0.0 (build ${{ github.run_number }})
          files: dist/warden-hit.jar
